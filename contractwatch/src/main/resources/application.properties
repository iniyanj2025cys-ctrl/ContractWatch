spring.application.name=contractwatch
server.port=8081

# Runs out of the box with a persistent local H2 database. Set SPRING_PROFILES_ACTIVE=mysql
# and configure the MYSQL_* environment variables to use MySQL instead.
spring.datasource.url=jdbc:h2:file:./data/contractwatch_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=####
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
